services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: educator-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - educator-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: educator-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - educator-network

networks:
  educator-network:
    driver: bridge
